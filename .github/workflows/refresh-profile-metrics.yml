name: Refresh cyberpunk profile telemetry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-profile-stats.mjs'
      - '.github/workflows/refresh-profile-metrics.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberpunk-profile-telemetry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render real GitHub metrics
        run: node scripts/refresh-profile-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish refreshed SVG graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/telemetry-board.svg assets/repository-signals.svg assets/contribution-activity.svg
          if git diff --cached --quiet; then
            echo 'No telemetry changes to commit'
            exit 0
          fi
          git commit -m 'chore(profile): refresh real GitHub metrics [skip ci]'
          git push
